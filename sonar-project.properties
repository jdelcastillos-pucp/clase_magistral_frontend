# SonarCloud — completar los TODO antes de usar.
# El SONAR_TOKEN va como GitHub Secret (no aquí).
sonar.projectKey=frontend-cursos
sonar.organization=jdelcastillos-pucp

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# Excluido del análisis por completo: dato, no código.
sonar.exclusions=src/courses.json

# Excluido SOLO de la cobertura (sigue analizándose para bugs/code smells):
# glue del navegador (DOM/fetch/config) que no tiene unit tests por diseño.
# La lógica pura testeable está en src/js/graph.js, que SÍ cuenta para cobertura.
sonar.coverage.exclusions=src/js/app.js,src/js/api.js,src/config.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
