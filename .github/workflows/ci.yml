name: CI

# CI: se ejecuta en cada Pull Request a main (gate antes de mergear).
on:
  pull_request:
    branches: [main]

jobs:
  # Calidad: tests + cobertura + SonarCloud
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Seguridad: Semgrep bloqueante; sube resultados a Semgrep AppSec Platform
  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semgrep ci hace scan diff-aware en PRs

      - name: Semgrep CI (bloqueante; reglas y subida vía Semgrep AppSec Platform)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Con SEMGREP_APP_TOKEN, `semgrep ci` toma las reglas del policy en
          # semgrep.dev y sube hallazgos; no se permite --config estando logueado.
          semgrep ci
