name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) Calidad: tests + cobertura + SonarCloud
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 2) Seguridad: Semgrep BLOQUEANTE (--error => exit != 0 si hay findings)
  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep (p/default + p/javascript, bloqueante)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep scan --config p/default --config p/javascript --error

  # 3) Deploy: solo push a main, tras quality y security
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar BACKEND_URL en config.js
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::Falta la variable de repo BACKEND_URL (Settings > Variables)."
            exit 1
          fi
          sed -i "s|__BACKEND_URL__|${{ vars.BACKEND_URL }}|g" src/config.js
          echo "config.js configurado."

      - name: Configure AWS credentials (Learner Lab, temporales)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Sync sitio estático a S3
        run: |
          if [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "::error::Falta la variable de repo S3_BUCKET (Settings > Variables)."
            exit 1
          fi
          aws s3 sync ./src s3://${{ vars.S3_BUCKET }} --delete
