name: CD

# CD: se ejecuta en push a main (tras mergear). Revalida quality + security y,
# solo si ambos pasan, despliega el sitio a S3.
on:
  push:
    branches: [main]

jobs:
  # Calidad: tests + cobertura + SonarCloud
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Seguridad: Semgrep bloqueante; sube resultados a Semgrep AppSec Platform
  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep CI (bloqueante; reglas y subida vía Semgrep AppSec Platform)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Con SEMGREP_APP_TOKEN, `semgrep ci` toma las reglas del policy en
          # semgrep.dev y sube hallazgos; no se permite --config estando logueado.
          semgrep ci

  # Deploy: solo tras quality y security
  deploy:
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar BACKEND_URL en config.js
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::error::Falta la variable de repo BACKEND_URL (Settings > Variables)."
            exit 1
          fi
          sed -i "s|export const BACKEND_URL = \"__BACKEND_URL__\";|export const BACKEND_URL = \"${{ vars.BACKEND_URL }}\";|" src/config.js
          echo "config.js configurado:"
          grep "export const BACKEND_URL" src/config.js

      - name: Configure AWS credentials (Learner Lab, temporales)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Sync sitio estático a S3
        run: |
          if [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "::error::Falta la variable de repo S3_BUCKET (Settings > Variables)."
            exit 1
          fi
          aws s3 sync ./src s3://${{ vars.S3_BUCKET }} --delete
